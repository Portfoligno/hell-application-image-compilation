name: Test

on:
  pull_request:
  push:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://hell-app-image-compilation.cachix.org?priority=30
            extra-trusted-public-keys = hell-app-image-compilation.cachix.org-1:OLLZe3quWexZQiUZpUIsAXMA3qqnivZELoJA32ch+PE=
            require-sigs = true
            always-allow-substitutes = false
            fallback = true
            connect-timeout = 5
            stalled-download-timeout = 30
            filetransfer-retry-attempts = 2
      - name: Build the native Hell checks automation image
        run: nix build --max-jobs 1 --no-update-lock-file --print-build-logs .#automation-checks --out-link result-automation-checks
      - name: Enforce repository automation policy
        run: ./result-automation-checks policy
      - name: Check fixed release metadata
        run: ./result-automation-checks metadata --check

  test:
    name: test (${{ matrix.system }})
    needs: metadata
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://hell-app-image-compilation.cachix.org?priority=30
            extra-trusted-public-keys = hell-app-image-compilation.cachix.org-1:OLLZe3quWexZQiUZpUIsAXMA3qqnivZELoJA32ch+PE=
            require-sigs = true
            always-allow-substitutes = false
            fallback = true
            connect-timeout = 5
            stalled-download-timeout = 30
            filetransfer-retry-attempts = 2
      - name: Evaluate locked flake metadata
        run: nix flake metadata --no-update-lock-file
      - name: Run all native checks
        run: nix flake check --max-jobs 1 --no-update-lock-file --print-build-logs
      - name: Build native static release candidate
        run: nix build --max-jobs 1 --no-update-lock-file .#release-static-native --out-link result-release
      - name: Rebuild release candidate deterministically
        run: nix build --max-jobs 1 --rebuild --no-link --no-update-lock-file --print-build-logs .#release-static-native
