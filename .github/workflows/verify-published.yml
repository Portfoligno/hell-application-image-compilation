name: Verify published release

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: verify-published-1.0.0_hell-2026-05-29-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  attestations: read
  contents: read

jobs:
  verify:
    name: read-only release verification (${{ matrix.arch }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out current verification policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check out exact published tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "1.0.0_hell-2026-05-29"
          path: published-source
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://hell-app-image-compilation.cachix.org?priority=30
            extra-trusted-public-keys = hell-app-image-compilation.cachix.org-1:OLLZe3quWexZQiUZpUIsAXMA3qqnivZELoJA32ch+PE=
            require-sigs = true
            always-allow-substitutes = false
            fallback = true
            connect-timeout = 5
            stalled-download-timeout = 30
            filetransfer-retry-attempts = 2
      - name: Build native release-control automation image
        run: nix build --max-jobs 1 --no-update-lock-file --print-build-logs .#automation-release-control --out-link result-automation-release-control
      - name: Rebuild release-control image deterministically
        run: nix build --max-jobs 1 --rebuild --no-link --no-update-lock-file --print-build-logs .#automation-release-control
      - name: Verify published release without mutation
        env:
          GH_TOKEN: ${{ github.token }}
          HELL_TARGET_ARCH: ${{ matrix.arch }}
        run: ./result-automation-release-control verify-published verified-release published-source

  documentation:
    name: validate exact tagged documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out current documentation verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check out fixed published tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "1.0.0_hell-2026-05-29"
          path: published-source
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://hell-app-image-compilation.cachix.org?priority=30
            extra-trusted-public-keys = hell-app-image-compilation.cachix.org-1:OLLZe3quWexZQiUZpUIsAXMA3qqnivZELoJA32ch+PE=
            require-sigs = true
            always-allow-substitutes = false
            fallback = true
            connect-timeout = 5
            stalled-download-timeout = 30
            filetransfer-retry-attempts = 2
      - name: Build native checks automation image
        run: nix build --max-jobs 1 --no-update-lock-file --print-build-logs .#automation-checks --out-link result-automation-checks
      - name: Rebuild checks automation image deterministically
        run: nix build --max-jobs 1 --rebuild --no-link --no-update-lock-file --print-build-logs .#automation-checks
      - name: Verify tagged documentation
        run: ./result-automation-checks check-docs published-source
